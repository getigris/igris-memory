[package]
name = "igris-memory"
version = "0.2.1"
edition = "2024"
description = "Persistent memory server for AI coding agents"
license = "Elastic-2.0"
repository = "https://github.com/getigris/igris-memory"
homepage = "https://www.getigris.com"
readme = "README.md"
authors = ["Alexander Diaz <hello@getigris.com>"]
keywords = ["mcp", "ai", "memory", "agent", "sqlite"]
categories = ["development-tools", "command-line-utilities", "database"]

[[bin]]
name = "igmem"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
regex = "1"
schemars = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4.6.0", features = ["derive"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", default-features = false }
sqlite-vec = "0.1.9"
ignore = "0.4.31"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-kotlin-ng = "1.1.0"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
rmcp = { version = "1.3", features = ["client"] }
mutants = "0.0.4"
mockito = "1"
